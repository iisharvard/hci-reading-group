<table class="schedule">
  <thead>
    <tr>
      <th>Date</th>
      <th>Title</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody>
    {% for item in include.sessions %}
      <tr>
        <td>{{ item.date | date: '%B %d, %Y' }}</td>
        <td>{{ item.title }}</td>
        <td>{% include details.html item=item %}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
